# Triton Baltic Sea Observer — semantic ontology (object types + physical mappings).
# Companion files:
#   ontology/graph.yaml                          — linkTypes + relationship graph
#   ontology/mappings/lidar_simulation_metadata.yaml — column ↔ property mapping
#   ontology/enums/lidar_classification_codes.yaml
#   cdv/datasets/LidarSimulationMetadata.dataset.json — CDV dataset import stub
#
# apiVersion: triton/ontology/v1

ontology:
  name: triton_baltic_defense
  namespace: defense
  description: Baltic maritime defense demo — AIS, buoys, harbours, LiDAR simulation.
  graph: ontology/graph.yaml
  mappings:
    - ontology/mappings/lidar_simulation_metadata.yaml

objectTypes:
  - apiName: LasPointCloudAsset
    displayName: LAS point cloud file
    description: Binary LAS object in HDFS/S3 (not a Hive row).
    primaryKey:
      - uri
    properties:
      - apiName: uri
        type: string
        description: e.g. s3a://bucket/path/vessel.las

  - apiName: BalticSeaHarbour
    displayName: Baltic Sea harbour
    backingDatasource:
      catalog: Hive
      database: defense
      table: baltic_sea_harbours
      primaryKey:
        - name
    properties:
      - apiName: name
        type: string
        column: name
      - apiName: country
        type: string
        column: country
      - apiName: latitude
        type: double
        column: latitude
      - apiName: longitude
        type: double
        column: longitude

  - apiName: LidarSimulationMetadata
    displayName: LiDAR simulation metadata
    description: >
      One row per simulated vessel LAS capture ingested from NiFi LidarSimulator
      (point cloud in object store; metadata in Iceberg).
    backingDatasource:
      catalog: Hive
      database: defense
      table: lidar_simulation_metadata
      storage: iceberg
      partition:
        - column: ingested_at
          transform: day
      primaryKey:
        - hadoop_file_url
    titleProperty: vesselName
    mappingFile: ontology/mappings/lidar_simulation_metadata.yaml
    properties:
      - apiName: hadoopFileUrl
        type: string
        column: hadoop_file_url
        required: true
        description: Object store URI of the LAS file.
        nifiAttribute: hadoop.file.url
        cdvParameter: lidar_hadoop_file_url

      - apiName: centerLatitude
        type: double
        column: center_lat
        description: Vessel scene center latitude (WGS84).
        nifiAttribute: lidar.center.lat
        cdvParameter: lidar_center_lat

      - apiName: centerLongitude
        type: double
        column: center_lon
        description: Vessel scene center longitude (WGS84).
        nifiAttribute: lidar.center.lon
        cdvParameter: lidar_center_lon

      - apiName: sceneCenter
        type: geopoint
        description: Composite geopoint for map visuals (lat, lon).
        mapping:
          latitude: center_lat
          longitude: center_lon

      - apiName: classification
        type: integer
        column: classification
        description: LAS point class code (vessel type / unclassified).
        nifiAttribute: lidar.classification
        cdvParameter: lidar_classification

      - apiName: filename
        type: string
        column: filename
        nifiAttribute: lidar.filename
        cdvParameter: lidar_filename

      - apiName: headingDegrees
        type: double
        column: heading_deg
        description: Vessel heading, degrees clockwise from north.
        nifiAttribute: lidar.heading_deg
        cdvParameter: lidar_heading_deg

      - apiName: pointCount
        type: long
        column: point_count
        nifiAttribute: lidar.point_count
        cdvParameter: lidar_point_count

      - apiName: vesselName
        type: string
        column: vessel_name
        nifiAttribute: lidar.vessel_name
        cdvParameter: lidar_vessel_name

      - apiName: vesselType
        type: string
        column: vessel_type
        description: Simulator vessel type key (e.g. corvette) or undefined.
        nifiAttribute: lidar.vessel_type
        cdvParameter: lidar_vessel_type

      - apiName: predictedVesselType
        type: string
        column: predicted_vessel_type
        description: ML-predicted vessel type label (string).
        cdvParameter: lidar_predicted_vessel_type

      - apiName: modelConfidence
        type: string
        column: model_confidence
        description: Model confidence for predicted vessel type (string).
        cdvParameter: lidar_model_confidence

      - apiName: ingestedAt
        type: timestamp
        column: ingested_at
        description: Row ingest time (Iceberg partition key).
        cdvParameter: lidar_ingested_at

    cdvDataset:
      suggestedName: LidarSimulationMetadata
      sqlTable: defense.lidar_simulation_metadata
      htmlPanelExample: cdv/lidar_metadata_iris_style_example.html
