# Datasource mapping: defense.das_cable_spectrogram_metadata → DasCableSpectrogramMetadata
# Import with ontology/triton_defense_ontology.yaml (object type + linkTypes).

apiVersion: triton/ontology-mapping/v1
objectType: DasCableSpectrogramMetadata

backingDatasource:
  catalog: Hive
  database: defense
  table: das_cable_spectrogram_metadata
  qualifiedName: defense.das_cable_spectrogram_metadata
  storage: iceberg
  primaryKey:
    - hadoop_file_url
    - segment_index

columnMappings:
